<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social Universitaria - Feed</title>

    <link rel="stylesheet" href="/assets/css/mano.css">
</head>

<body>

    <!-- Navegación Superior -->
    <header>
        <div class="logo">CampusConnect</div>
        <input type="search" placeholder="Buscar usuarios o temas...">
        <div>
            <span style="font-size: 20px; cursor: pointer;">🔔</span>
        </div>
        <div class="nav-profile-container">
            <div class="profile-trigger">
                <img src="https://via.placeholder.com/32" alt="Mi Avatar" class="avatar-small">
                <span>Mi Usuario</span>
            </div>


        </div> <!-- Menú Desplegable -->

    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="nav-profile-container">
            <div class="campus">
                <select name="campus" id="campus-select">
                    <optgroup label="Sinaloa">
                        <option value="mochis">Mochis</option>
                        <option value="mazatlan">Mazatlán</option>
                    </optgroup>
                    <optgroup label="Jalisco">
                        <option value="guadalajara">Guadalajara</option>
                        <option value="zapopan">Zapopan</option>
                    </optgroup>
                </select>
            </div>
        </div>
        <!-- Carrusel de Historias / Estados -->
        <section class="stories-container">
            <div class="story-item">
                <div class="story-avatar">
                    <img src="https://via.placeholder.com/56" alt="Usuario">
                </div>
                <span class="story-username">tu_historia</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="https://via.placeholder.com/56" alt="Usuario">
                </div>
                <span class="story-username">maria_cs</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="https://via.placeholder.com/56" alt="Usuario">
                </div>
                <span class="story-username">club_ia</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="https://via.placeholder.com/56" alt="Usuario">
                </div>
                <span class="story-username">nexus</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="https://via.placeholder.com/56" alt="Usuario">
                </div>
                <span class="story-username">hexacrews</span>
            </div>
        </section>

        <!-- Feed Cronológico: Publicación 1 -->
        <article class="post-card">
            <header class="post-header">
                <img src="https://via.placeholder.com/32" alt="Avatar">
                <span class="username">comunidad_ing</span>
            </header>

            <div class="post-image">
                <img src="https://via.placeholder.com/470x470" alt="Contenido del Post">
            </div>

            <div class="post-actions">
                <button class="action-btn">❤️</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">✈️</button>
            </div>

            <div class="post-details">
                <div class="likes-count">124 Me gusta</div>
                <div class="caption">
                    <span>comunidad_ing</span>
                    ¡Listos los equipos para el hackathon de este fin de semana! 🚀💻
                </div>
                <div class="timestamp">HACE 2 HORAS</div>
            </div>
        </article>
        
    </main>

</body>

</html>
